 <button data-view="home" onclick="go('home')" class="active"><span class="qicon">⌂</span><span class="qlabel">Accueil</span></button>
 <button data-view="discover" onclick="go('discover')"><span class="qicon">▷</span><span class="qlabel">Découvrir</span></button>
 <button data-view="create" onclick="go('create')"><span class="qicon">＋</span><span class="qlabel">Créer / Live</span></button>
 <button data-view="messages" onclick="go('messages')"><span class="qicon">▱</span><span class="qlabel">Messages</span><span id="messageNavBadge" class="count-badge nav-count" style="display:none">0</span></button>
 <button data-view="menu" onclick="go('menu')" aria-label="Ouvrir le menu"><span class="qicon">☰</span><span class="qlabel">Menu</span></button>
</nav></header>
<main id="main"></main></div>
<script>
const KEY='jconnect_v2_data', SESSION='jconnect_v2_session';
let db=load(), current=localStorage.getItem(SESSION)||'', view='home', pickedImage='', memberQuery='';
// V2 : aucune identité propriétaire n'est précréée. Chaque installation commence par l'inscription de son utilisateur.
db.messages=Array.isArray(db.messages)?db.messages:[]; db.stories=Array.isArray(db.stories)?db.stories:[]; db.videos=Array.isArray(db.videos)?db.videos:[];
db.posts=Array.isArray(db.posts)?db.posts:[]; db.users=Array.isArray(db.users)?db.users:[]; db.discoverLinks=Array.isArray(db.discoverLinks)?db.discoverLinks:[]; db.settings=db.settings||{theme:'dark',notifications:true,private:true};
if(!db.posts)db.posts=[];

function load(){try{const d=JSON.parse(localStorage.getItem(KEY))||{users:[],posts:[],stories:[],settings:{theme:'dark',notifications:true,private:true}};d.trash=Array.isArray(d.trash)?d.trash:[];return d}catch(e){return {users:[],posts:[],stories:[],trash:[],settings:{theme:'dark',notifications:true,private:true}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));setTimeout(updateCountBadges,0);return true}catch(e){console.error('J-Connect save failed',e);alert('Enregistrement impossible : le stockage du navigateur est peut-être plein. Exporte tes données et réduis la taille des photos.');return false}}
function me(){return db.users.find(u=>u.id===current)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return (n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function hasPantherBadge(u){return !!u&&(u.role==='owner'||(u.subscription?.status==='active'&&Number(u.subscription.until)>Date.now()))}
function pantherBadge(u){return hasPantherBadge(u)?'<span class="panther-badge" title="Badge Panthère Noire J-Connect" aria-label="Badge Panthère Noire vérifié sur J-Connect">✓</span>':''}
function avatar(u){return `<div class="avatar">${u&&u.photo?`<img src="${u.photo}">`:esc(initials(u?.name))}${pantherBadge(u)}</div>`}
function go(v){view=v;render()}
function render(){document.querySelectorAll('.quicknav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const topAvatar=document.getElementById('topAvatar');if(topAvatar){const badge=document.getElementById('topAvatarInitials');if(badge)badge.textContent=me()?initials(me().name):'JE';}if(!me()){welcome();return}({home,discover,messages,notifications,groups,profile,settings,create,author,members,menu}[view]||home)();applyTheme();updateCountBadges()}

function unreadMessageCount(){return (db.messages||[]).filter(m=>m.to===current&&!m.deletedForAll&&!(m.deletedFor||[]).includes(current)&&!(m.readBy||[]).includes(current)).length}
function unreadNotificationCount(){return (db.notifications||[]).filter(n=>n.to===current&&!n.read).length}
function badgeText(n){return n>9?'9+':String(n)}
function updateCountBadges(){const mc=unreadMessageCount(),nc=unreadNotificationCount();[['messageNavBadge',mc],['topNotifyBadge',nc]].forEach(([id,n])=>{const e=document.getElementById(id);if(e){e.textContent=badgeText(n);e.style.display=n?'inline-flex':'none'}})}
function notifications(){db.notifications=Array.isArray(db.notifications)?db.notifications:[];const items=db.notifications.filter(n=>n.to===current).sort((a,b)=>b.created-a.created);document.getElementById('main').innerHTML=`<h2 class="sectiontitle">♢ Notifications <span class="count-badge">${items.filter(n=>!n.read).length}</span></h2><section class="hero"><div class="eyebrow">PANTHÈRE NOIRE · EN DIRECT SUR CET APPAREIL</div><h1>Ton actualité, au même endroit.</h1><p>Retrouve les alertes et les nouvelles interactions de ton compte.</p><div class="actions"><button class="btn primary" onclick="markAllNotificationsRead()">✓ Tout marquer comme lu</button><button class="btn" onclick="go('messages')">▱ Voir les messages <span class="count-badge">${badgeText(unreadMessageCount())}</span></button></div></section><div class="card"><div class="split"><h3>Récentes</h3><span class="muted">${items.length} notification${items.length===1?'':'s'}</span></div>${items.length?items.map(n=>`<div class="notification-row ${n.read?'':'unread'}"><div class="notify-icon">${esc(n.icon||'♢')}</div><div class="grow"><b>${esc(n.title||'Notification')}</b><p>${esc(n.text||'Nouvelle activité sur J-Connect.')}</p><small>${new Date(n.created||Date.now()).toLocaleString('fr-FR')}</small>${n.kind==='message'?`<div style="margin-top:8px"><button class="btn primary" onclick="openNotificationChat('${n.from}')">Répondre</button></div>`:''}</div>${n.read?'':'<span class="notification-dot" title="Non lue"></span>'}</div>`).join(''):'<p class="empty">Tu es à jour ! Les nouvelles notifications apparaîtront ici.</p>'}</div><p class="note">Les compteurs sont calculés à partir des données enregistrées sur cet appareil. Les notifications push même lorsque l’application est fermée nécessiteront ensuite un serveur et une configuration mobile.</p>`;updateCountBadges()}
function markAllNotificationsRead(){db.notifications=(db.notifications||[]).map(n=>n.to===current?{...n,read:true}:n);save();notifications()}
function openNotificationChat(id){db.notifications=(db.notifications||[]).map(n=>n.to===current&&n.from===id?{...n,read:true}:n);save();startChat(id)}

function welcome(){document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">BIENVENUE DANS VOTRE ESPACE</div><h1>Les rencontres commencent ici.</h1><p>Partagez vos idées, retrouvez vos connaissances et faites grandir votre communauté.</p></section><div class="card"><h2>Créer votre compte</h2><label class="muted">Nom complet</label><input class="field" id="regName" placeholder="Ex. Jordi Ewawa"><label class="muted">Nom d'utilisateur</label><input class="field" id="regUser" placeholder="@votreidentifiant"><label class="muted">Téléphone</label><input class="field" id="regPhone" type="tel" placeholder="+243..."><label class="muted">Mot de passe</label><input class="field" id="regPass" type="password" placeholder="Au moins 8 caractères"><button class="btn primary" style="width:100%" onclick="register()">Créer mon compte</button><p class="note">Version de test locale : crée ton propre compte sur cet appareil. Les comptes et publications ne sont pas encore synchronisés entre téléphones.</p><hr style="border-color:var(--line);margin:18px 0"><h3>Déjà membre ?</h3><input class="field" id="loginUser" placeholder="Nom d'utilisateur"><input class="field" id="loginPass" type="password" placeholder="Mot de passe"><button class="btn" style="width:100%" onclick="login()">Se connecter</button><button class="btn" style="width:100%;margin-top:9px" onclick="recoverAccount()">Mot de passe oublié ? Récupérer mon compte</button></div>`}
const RECOVERY_QUESTIONS=[
'Quel est le prénom de ton meilleur ami d’enfance ?',
'Dans quelle ville es-tu né(e) ?',
'Quel était le surnom que ta famille te donnait ?',
'Quel est le prénom de ton premier enseignant ?',
'Quel était le nom de ton école primaire ?',
'Quel est le mois de naissance de ta mère ?',
'Quel était ton premier métier rêvé ?',
'Quel est le prénom de ton premier animal de compagnie ?',
'Quel est le nom de la rue où tu as grandi ?',
'Quel est ton plat préféré depuis l’enfance ?'
];
const normAnswer=s=>String(s||'').trim().toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
async function answerHash(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(normAnswer(s)));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function recoverySetup(){if(!me())return;document.getElementById('main').innerHTML=`<button class="btn" onclick="profile()">← Retour au compte</button><section class="card"><h2>🔐 Préparer la récupération</h2><p class="note">Choisis 7 questions différentes. Donne des réponses exactes, personnelles et difficiles à deviner. Mémorise-les exactement.</p>${Array.from({length:7},(_,i)=>`<label class="muted">Question ${i+1}</label><select class="field" id="rq${i}"><option value="">Choisir une question</option>${RECOVERY_QUESTIONS.map((q,j)=>`<option value="${j}">${esc(q)}</option>`).join('')}</select><input class="field" id="ra${i}" placeholder="Ta réponse" autocomplete="off">`).join('')}<button class="btn primary" style="width:100%" onclick="saveRecoverySetup()">Enregistrer mes 7 réponses</button><p class="note">Les réponses sont enregistrées sous forme d’empreintes cryptographiques dans le stockage local. Elles ne sont pas envoyées à un serveur.</p></section>`;applyTheme()}
async function saveRecoverySetup(){let qs=[],ans=[];for(let i=0;i<7;i++){let q=document.getElementById('rq'+i).value,a=document.getElementById('ra'+i).value.trim();if(q===''||!a)return alert('Choisis les 7 questions et remplis toutes les réponses.');if(qs.includes(q))return alert('Choisis 7 questions différentes.');qs.push(q);ans.push(a)}if(!crypto.subtle)return alert('La sécurité cryptographique nécessite une connexion HTTPS.');me().recovery={items:await Promise.all(qs.map(async(q,i)=>({q:Number(q),hash:await answerHash(ans[i])}))),updated:Date.now()};save();alert('Tes 7 questions sont enregistrées sur cet appareil.');profile()}
function recoverAccount(){document.getElementById('main').innerHTML=`<button class="btn" onclick="welcome()">← Retour à la connexion</button><section class="card"><h2>Récupérer mon compte</h2><p class="note">Entre ton identifiant pour afficher les méthodes disponibles.</p><input class="field" id="recoverUser" placeholder="Nom d’utilisateur"><button class="btn primary" style="width:100%" onclick="showRecoveryMethods()">Continuer</button><p class="note">Les codes SMS et e-mail nécessitent un serveur sécurisé et ne sont pas encore activés dans cette version.</p></section>`;applyTheme()}
function showRecoveryMethods(){let n=document.getElementById('recoverUser').value.trim().replace(/^@/,'').toLowerCase(),u=db.users.find(x=>x.username===n);if(!u)return alert('Compte introuvable sur cet appareil.');window.recoveryTarget=u.id;document.getElementById('main').innerHTML=`<button class="btn" onclick="recoverAccount()">← Retour</button><section class="card"><h3>Choisis une méthode</h3><div class="card"><b>📱 Code par SMS</b><p class="note">Numéro : ${esc(u.phone||'Aucun numéro renseigné')}. Envoi réel à activer avec le serveur SMS.</p><button class="btn" style="width:100%" onclick="alert('L’envoi de codes SMS sera activé après la connexion au serveur et au fournisseur SMS.')">Utiliser le SMS</button></div><div class="card"><b>✉ Code par e-mail</b><p class="note">Adresse : ${esc(u.email||'Aucune adresse renseignée')}. Envoi réel à activer avec le serveur e-mail.</p><button class="btn" style="width:100%" onclick="alert('L’envoi de codes e-mail sera activé après la connexion au serveur de messagerie.')">Utiliser l’e-mail</button></div><div class="card"><b>🛡️ 7 questions de sécurité</b><p class="note">${u.recovery?.items?.length===7?'Les 7 questions sont configurées.':'Aucune série de questions n’a été configurée pour ce compte.'}</p><button class="btn primary" style="width:100%" ${u.recovery?.items?.length===7?'':'disabled'} onclick="answerRecovery()">Répondre aux questions</button></div></section>`;applyTheme()}
function answerRecovery(){let u=db.users.find(x=>x.id===window.recoveryTarget);if(!u?.recovery?.items)return;document.getElementById('main').innerHTML=`<button class="btn" onclick="showRecoveryMethods()">← Retour</button><section class="card"><h2>Vérification de sécurité</h2><p class="note">Réponds aux 7 questions comme lors de la configuration.</p>${u.recovery.items.map((it,i)=>`<label class="muted">${i+1}. ${esc(RECOVERY_QUESTIONS[it.q])}</label><input class="field" id="answer${i}" autocomplete="off" placeholder="Ta réponse">`).join('')}<button class="btn primary" style="width:100%" onclick="verifyRecoveryAnswers()">Vérifier mes réponses</button></section>`;applyTheme()}
async function verifyRecoveryAnswers(){let u=db.users.find(x=>x.id===window.recoveryTarget);if(!u?.recovery?.items)return;for(let i=0;i<7;i++){if(await answerHash(document.getElementById('answer'+i).value)!==u.recovery.items[i].hash)return alert('Une ou plusieurs réponses sont incorrectes. Réessaie.')}document.getElementById('main').innerHTML=`<section class="card"><h2>Nouveau mot de passe</h2><p class="note">Vérification réussie pour @${esc(u.username)}.</p><input class="field" id="newRecoverPass" type="password" placeholder="Nouveau mot de passe (8 caractères minimum)"><input class="field" id="confirmRecoverPass" type="password" placeholder="Confirmer le mot de passe"><button class="btn primary" style="width:100%" onclick="resetRecoveredPassword()">Changer le mot de passe</button></section>`;applyTheme()}
function resetRecoveredPassword(){let u=db.users.find(x=>x.id===window.recoveryTarget),a=document.getElementById('newRecoverPass').value,b=document.getElementById('confirmRecoverPass').value;if(!u||a.length<8||a!==b)return alert('Les deux mots de passe doivent être identiques et contenir au moins 8 caractères.');u.pass=a;save();alert('Mot de passe modifié sur cet appareil. Tu peux maintenant te connecter.');welcome()}
function register(){let name=document.getElementById('regName').value.trim(),username=document.getElementById('regUser').value.trim().replace(/^@/, '').toLowerCase(),phone=document.getElementById('regPhone').value.trim(),pass=document.getElementById('regPass').value;if(!name||!username||!phone||pass.length<8)return alert('Complétez tous les champs et choisissez un mot de passe de 8 caractères minimum.');if(db.users.some(u=>u.username===username||u.phone===phone))return alert('Cet identifiant ou numéro existe déjà sur cet appareil.');let u={id:crypto.randomUUID(),name,username,phone,pass,photo:'',bio:'',school:'',city:'',role:'member',blocked:false,created:Date.now(),createdBy:'self-registration',createdByLabel:'Inscription directe par le formulaire J-Connect'};db.users.push(u);current=u.id;localStorage.setItem(SESSION,current);save();go('home')}
function login(){let username=document.getElementById('loginUser').value.trim().replace(/^@/,'').toLowerCase(),pass=document.getElementById('loginPass').value,u=db.users.find(x=>x.username===username&&x.pass===pass);if(!u)return alert('Identifiants incorrects.');if(u.blocked)return alert('Ce compte est bloqué sur cet appareil. Contactez le propriétaire.');current=u.id;localStorage.setItem(SESSION,current);go('home')}
function home(){let u=me(),posts=[...db.posts].sort((a,b)=>b.created-a.created),stories=db.stories.filter(s=>Date.now()-s.created<86400000);document.getElementById('main').innerHTML=`<section class="hero"><div class="eyebrow">VOTRE COMMUNAUTÉ</div><h1>Bonjour ${esc(u.name.split(' ')[0])} ✨</h1><p>Une idée à partager ? Votre prochaine belle rencontre commence peut-être ici.</p></section><div class="split"><div class="sectionlabel">À la une</div><span class="muted">Éphémères · 24 h</span></div><div class="stories"><button class="story" onclick="addStory()"><div class="storyinitial">＋</div><div class="storyshade"></div><div class="storyplus">＋</div><div class="storyname">Créer un éphémère</div></button>${stories.map(s=>`<button type="button" class="story" onclick="openStory('${s.id}')" aria-label="Voir l’éphémère de ${esc(s.name)}">${s.photo?`<img class="storyphoto" src="${s.photo}" alt="Éphémère de ${esc(s.name)}">`:''}<div class="storyinitial">${esc(initials(s.name))}</div><div class="storyshade"></div><div class="storyname">${esc(s.name)}</div></button>`).join('')}</div><div class="card composer"><div class="row">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted">Exprimez-vous librement</div></div></div><textarea id="postText" placeholder="Qu’avez-vous envie de partager aujourd’hui ?"></textarea><div id="preview"></div><div class="actions"><button class="btn" onclick="document.getElementById('postFile').click()">▧ Photo</button><input id="postFile" class="hidden" type="file" accept="image/*" onchange="readPostImage(this)"><span class="muted">Une idée peut inspirer quelqu’un.</span><span class="spacer"></span><button class="btn primary" onclick="publish()">Publier</button></div></div><input class="field" id="postSearch" placeholder="⌕ Rechercher dans les publications..." oninput="filterPosts(this.value)"><div id="postList">${postCards(posts)}</div>`}
function trackPostView(p){p.views=Array.isArray(p.views)?p.views:[];if(current&&p.user!==current&&!p.views.includes(current)){p.views.push(current);save()}return p.views.length}
function postCards(posts){if(!posts.length)return `<div class="card empty"><div class="star">✧</div><h3>Votre fil commence ici</h3><p>Aucune publication pour le moment. Les vraies publications apparaîtront ici lorsque les membres rejoindront J-Connect.</p></div>`;return posts.map(p=>{p.likes=Array.isArray(p.likes)?p.likes:[];p.comments=Array.isArray(p.comments)?p.comments:[];let viewCount=trackPostView(p),u=db.users.find(x=>x.id===p.user),liked=p.likes.includes(current);return `<article class="card"><div class="row">${avatar(u)}<div class="grow"><b>${esc(u?.name||'Compte indisponible')}</b><div class="muted">@${esc(u?.username||'')} · ${new Date(p.created).toLocaleString('fr-FR')}</div></div>${p.user===current?`<button class="iconbtn" onclick="deletePost('${p.id}')">···</button>`:''}</div><div class="posttext">${esc(p.text)}</div>${p.image?`<img class="postimg" src="${p.image}">`:''}<div class="posttools"><span class="view-count" title="Vues uniques sur cet appareil/navigateur">◉ ${viewCount} vues</span><button class="${liked?'active':''}" onclick="likePost('${p.id}')">♡ ${p.likes.length} J'aime</button><button onclick="commentPost('${p.id}')">▢ ${p.comments.length} Commentaires</button><button onclick="sharePost('${p.id}')">↗ Partager</button></div>${p.comments.slice(-2).map(c=>`<p class="muted" style="margin-top:8px"><b>${esc(db.users.find(x=>x.id===c.user)?.name||'Membre')} :</b> ${esc(c.text)}</p>`).join('')}</article>`}).join('')}
function readPostImage(input){let f=input.files[0];if(!f)return;if(f.size>3*1024*1024)return alert('Choisissez une image de moins de 3 Mo.');let r=new FileReader();r.onload=()=>{pickedImage=r.result;document.getElementById('preview').innerHTML=`<img class="postimg" src="${pickedImage}">`};r.readAsDataURL(f)}
function publish(){let text=document.getElementById('postText').value.trim();if(!text&&!pickedImage)return alert('Ajoutez un texte ou une photo.');db.posts.push({id:crypto.randomUUID(),user:current,text,image:pickedImage,created:Date.now(),likes:[],comments:[]});pickedImage='';save();home()}
function likePost(id){let p=db.posts.find(x=>x.id===id);if(!p)return;p.likes=p.likes.includes(current)?p.likes.filter(x=>x!==current):[...p.likes,current];save();home()}
function commentPost(id){let t=prompt('Votre commentaire :');if(!t?.trim())return;let p=db.posts.find(x=>x.id===id);p.comments.push({user:current,text:t.trim(),created:Date.now()});save();home()}
function sharePost(id){let p=db.posts.find(x=>x.id===id);if(navigator.share)navigator.share({title:'J-Connect',text:p.text||'Découvrez cette publication sur J-Connect'}).catch(()=>{});else alert('Le partage natif sera disponible dans la version installée.')}
function deletePost(id){const item=db.posts.find(p=>p.id===id);if(!item||item.user!==current)return alert('Tu peux déplacer uniquement tes propres publications vers la corbeille.');if(!confirm('Déplacer cette publication vers la corbeille ? Tu pourras la restaurer depuis Mon compte.'))return;db.trash=db.trash||[];db.trash.unshift({id:'trash_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type:'post',item:JSON.parse(JSON.stringify(item)),user:current,deletedAt:Date.now()});db.posts=db.posts.filter(p=>p.id!==id);if(!save())return;if(view==='profile')profile();else home();showUndoToast('Publication déplacée dans la corbeille. Tu peux la restaurer dans Mon compte.');}
function filterPosts(q){let list=db.posts.filter(p=>(p.text||'').toLowerCase().includes(q.toLowerCase()));document.getElementById('postList').innerHTML=postCards(list)}
function addStory(){let input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{let f=input.files[0];if(!f)return;if(f.size>7*1024*1024)return alert('Choisis une image de moins de 7 Mo pour assurer son enregistrement.');let r=new FileReader();r.onload=()=>{const story={id:crypto.randomUUID(),user:current,name:me().name,photo:r.result,created:Date.now(),likes:[]};db.stories.push(story);if(!save()){db.stories=db.stories.filter(s=>s.id!==story.id);return alert('La story n’a pas pu être enregistrée. Essaie une image plus légère ou exporte tes données.')}if(view==='profile')profile();else home();alert('Story publiée et enregistrée dans Mon compte. Elle sera visible dans le fil pendant 24 h.');};r.readAsDataURL(f)};input.click()}
let activeStoryId=null;
function storyList(){return (db.stories||[]).filter(s=>Date.now()-s.created<86400000).sort((a,b)=>a.created-b.created)}
function openStory(id){let story=(db.stories||[]).find(s=>s.id===id);if(!story)return;story.views=Array.isArray(story.views)?story.views:[];if(current&&story.user!==current&&!story.views.includes(current)){story.views.push(current);save()}activeStoryId=id;renderStoryViewer(story)}
function renderStoryViewer(story){let owner=db.users.find(u=>u.id===story.user);story.likes=Array.isArray(story.likes)?story.likes:[];let liked=story.likes.includes(current),mine=story.user===current;document.getElementById('storyViewer')?.remove();let el=document.createElement('div');el.id='storyViewer';el.className='story-viewer';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Éphémère');el.onclick=e=>{if(e.target===el)closeStory()};el.innerHTML=`<section class="story-stage"><img class="story-stage-photo" src="${story.photo||''}" alt="Éphémère de ${esc(story.name)}"><div class="story-stage-shade"></div><div class="story-progress"><span></span></div><header class="story-view-head">${owner?.photo?`<img class="story-view-avatar" src="${owner.photo}" alt="">`:`<div class="story-view-avatar" style="display:grid;place-items:center;background:#b18a36;color:#17120a;font-weight:900">${esc(initials(story.name))}</div>`}<div><div class="story-view-name">${esc(story.name||owner?.name||'Membre')}</div><div class="story-view-time">${new Date(story.created).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div><button class="story-view-close" onclick="closeStory()" aria-label="Fermer">×</button></header><button class="story-nav prev" onclick="moveStory(-1)" aria-label="Story précédente"></button><button class="story-nav next" onclick="moveStory(1)" aria-label="Story suivante"></button><footer class="story-view-actions"><button class="${liked?'story-liked':''}" onclick="likeStory('${story.id}')">${liked?'♥':'♡'} ${liked?'Aimé':'J’aime'}${story.likes.length?' · '+story.likes.length:''}</button>${mine?`<span style="color:#f3dc98;font-size:12px;font-weight:800;align-self:center">◉ ${(story.views||[]).length} vues</span>`:''}<button onclick="shareStory('${story.id}')">↗ Partager</button>${mine?`<button class="story-delete" onclick="deleteStory('${story.id}')">🗑 Supprimer</button>`:''}</footer></section>`;document.body.appendChild(el);document.addEventListener('keydown',storyKeyHandler)}
function closeStory(){document.getElementById('storyViewer')?.remove();document.removeEventListener('keydown',storyKeyHandler);activeStoryId=null}

async function imageFingerprint(src){return new Promise(resolve=>{let img=new Image();img.onload=()=>{try{let c=document.createElement('canvas');c.width=12;c.height=12;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,12,12);let d=x.getImageData(0,0,12,12).data,a=[];for(let i=0;i<d.length;i+=4){a.push((d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255);a.push(d[i]/255);a.push(d[i+1]/255);a.push(d[i+2]/255)}resolve(a)}catch(e){resolve(null)}};img.onerror=()=>resolve(null);img.src=src})}
function fingerprintDistance(a,b){if(!a||!b||a.length!==b.length)return 1;let sum=0;for(let i=0;i<a.length;i++)sum+=Math.abs(a[i]-b[i]);return sum/a.length}
async function searchByPhoto(input){let f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/'))return alert('Choisissez une image.');if(f.size>8*1024*1024)return alert('Image trop lourde : maximum 8 Mo.');let reader=new FileReader();reader.onload=async()=>{let area=document.getElementById('photoSearchResult');if(!area)return;area.innerHTML='<p class="muted">Comparaison des images en cours…</p>';let fp=await imageFingerprint(reader.result);if(!fp){area.innerHTML='<p class="muted">Impossible de lire cette image. Essayez un autre fichier.</p>';return}
let users=[];for(let u of db.users){if(!u.photo)continue;let d=fingerprintDistance(fp,await imageFingerprint(u.photo));if(d<.16)users.push({...u,_distance:d})}users.sort((a,b)=>a._distance-b._distance);
let posts=[];for(let p of db.posts){if(!p.image)continue;let d=fingerprintDistance(fp,await imageFingerprint(p.image));if(d<.16)posts.push({...p,_distance:d})}posts.sort((a,b)=>a._distance-b._distance);

ojets</h3><p><b>L’univers dans ma main</b> — son livre publié, qui témoigne de la force de l’expression artistique et de la parole poétique.</p><p style="margin-top:8px"><b>MON RÊVE</b> — un projet de livre poétique en préparation, autour du rêve, du désir, de l’espoir et de la confrontation entre ce que l’on imagine et ce que la vie permet.</p></div><div class="author-block"><h3>Pourquoi la panthère noire ?</h3><p>La panthère noire représente ici une signature symbolique : la discrétion, la force, la détermination et la liberté de tracer son propre chemin. Elle incarne l’esprit artistique que l’auteur souhaite associer à son nom de plume.</p></div><div class="author-block"><h3>📚 Acheter le livre</h3><p>Vous souhaitez découvrir <b>L’univers dans ma main</b> ou commander un exemplaire ? Envoyez directement un message à l’auteur.</p><div class="book-buy"><img src="panthere-noire-auteur.jpg" alt="Emblème Panthère Noire"><div class="grow"><b>Commande & renseignements</b><div class="muted">Contact direct avec l’auteur</div></div><a class="btn primary" href="mailto:maviedestar17@gmail.com?subject=Commande%20du%20livre%20-%20J-Connect&body=Bonjour%20Jordi%2C%0AJe%20souhaite%20avoir%20des%20informations%20pour%20acheter%20votre%20livre%20%22L%E2%80%99univers%20dans%20ma%20main%22.%0A%0AMerci." style="text-decoration:none">Écrire</a></div><p class="note">Adresse : maviedestar17@gmail.com. Le bouton ouvre l’application e-mail du visiteur.</p></div><div class="author-quote">« Les mots peuvent ouvrir des portes que le silence garde fermées. »<br><b>— Panthère Noire</b></div><p class="note" style="margin-top:14px">Cette page est l’espace officiel de présentation de l’auteur dans J-Connect.</p></section>`}
let activeChat='';
function startChat(id){if(id===current)return alert('Vous ne pouvez pas vous envoyer un message à vous-même.');if(!db.users.some(u=>u.id===id))return;activeChat=id;db.messages=(db.messages||[]).map(m=>m.to===current&&m.from===id?{...m,readBy:[...new Set([...(m.readBy||[]),current])]}:m);db.notifications=(db.notifications||[]).map(n=>n.to===current&&n.from===id?{...n,read:true}:n);save();go('messages')}
function chatMessages(id){return (db.messages||[]).filter(m=>!(m.deletedFor||[]).includes(current)&&((m.from===current&&m.to===id)||(m.from===id&&m.to===current))).sort((a,b)=>a.created-b.created)}
function sendChat(){let input=document.getElementById('chatText'),text=input?.value.trim();if(!text)return;db.messages=db.messages||[];db.messages.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2),from:current,to:activeChat,text,created:Date.now()});save();messages()}
function closeMessageMenu(){document.getElementById('msgMenuBackdrop')?.remove()}
function openMessageMenu(id){let m=db.messages.find(x=>x.id===id);if(!m)return;closeMessageMenu();if(m.deletedForAll)return alert(m.deletedLabel||'Ce message a été retiré pour tous.');const own=m.from===current;const backdrop=document.createElement('div');backdrop.id='msgMenuBackdrop';backdrop.className='msg-menu-backdrop';backdrop.onclick=e=>{if(e.target===backdrop)closeMessageMenu()};backdrop.innerHTML=`<section class="msg-menu" role="dialog" aria-modal="true" aria-label="Options du message"><h3 class="msg-menu-head">${own?'Votre message':'Message reçu'}</h3><div class="muted">${new Date(m.created).toLocaleString('fr-FR')}</div><div class="msg-menu-preview">${esc(m.text)}</div><div class="msg-menu-grid"><button onclick="replyToMessage('${m.id}')"><span>↩️</span> Répondre</button><button onclick="forwardChatMessage('${m.id}');closeMessageMenu()"><span>↗️</span> Transférer</button><button onclick="copyChatMessage('${m.id}')"><span>📋</span> Copier le texte</button><button onclick="reactToMessage('${m.id}','❤️')"><span>❤️</span> Réagir ❤️</button>${own?`<button class="delete-option" onclick="deleteChatMessage('${m.id}');closeMessageMenu()"><span>🗑️</span> Supprimer pour moi</button><button class="delete-option" onclick="deleteChatMessageForAll('${m.id}');closeMessageMenu()"><span>🚫</span> Supprimer pour tous</button>`:''}<button onclick="messageDetails('${m.id}')"><span>ℹ️</span> Détails</button></div><button class="msg-menu-close" onclick="closeMessageMenu()">Annuler</button></section>`;document.body.appendChild(backdrop)}
function replyToMessage(id){let m=db.messages.find(x=>x.id===id);closeMessageMenu();const box=document.getElementById('chatText');if(box&&m){box.value='↩ '+(m.from===current?'Moi':(db.users.find(u=>u.id===m.from)?.name||'Membre'))+' : '+m.text+'\n';box.focus();box.setSelectionRange(box.value.length,box.value.length)}}
async function copyChatMessage(id){let m=db.messages.find(x=>x.id===id);if(!m)return;try{await navigator.clipboard.writeText(m.text);alert('Texte copié.')}catch(e){prompt('Copie ce texte :',m.text)}closeMessageMenu()}
function reactToMessage(id,reaction){let m=db.messages.find(x=>x.id===id);if(!m)return;m.reactions=m.reactions||{};m.reactions[current]=reaction;save();closeMessageMenu();messages()}
function messageDetails(id){let m=db.messages.find(x=>x.id===id);if(!m)return;alert('Envoyé par : '+(db.users.find(u=>u.id===m.from)?.name||'Membre')+'\nDate : '+new Date(m.created).toLocaleString('fr-FR')+'\nStatut : enregistré sur cet appareil');closeMessageMenu()}
function deleteChatMessage(id){let m=(db.messages||[]).find(x=>x.id===id);if(!m)return;if(!confirm('Supprimer ce message uniquement pour toi ?'))return;m.deletedFor=m.deletedFor||[];if(!m.deletedFor.includes(current))m.deletedFor.push(current);if(!save())return;closeMessageMenu();messages();showUndoToast('Message supprimé de ta conversation. L’autre participant peut toujours le voir.')}
function deleteChatMessageForAll(id){let m=(db.messages||[]).find(x=>x.id===id);if(!m||m.from!==current)return alert('Tu peux uniquement retirer tes propres messages.');if(m.deletedForAll)return;if(!confirm('Retirer ce message pour tous ? Les autres verront « '+(me()?.name||'Jordi')+' a retiré le message ».'))return;m.deletedForAll=true;m.deletedLabel=(me()?.name||'Jordi')+' a retiré le message';m.text='';save();messages()}

function messages(){let people=db.users.filter(u=>u.id!==current&&!u.blocked),q=(window.chatSearch||'').toLowerCase(),shown=people.filter(u=>(u.name+' '+u.username).toLowerCase().includes(q));let target=db.users.find(u=>u.id===activeChat);let thread=target?chatMessages(activeChat):[];document.getElementById('main').innerHTML=`<h2 class="sectiontitle">Messages privés</h2><div class="card"><h3>🔎 Trouver un ami</h3><input class="field" placeholder="Rechercher par nom ou identifiant" value="${esc(window.chatSearch||'')}" oninput="window.chatSearch=this.value;messages()"><div>${shown.length?shown.map(u=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div><button class="btn primary" onclick="startChat('${u.id}')">Écrire</button></div>`).join(''):'<p class="muted">Aucun membre trouvé sur cet appareil.</p>'}</div></div>${target?`<div class="card"><div class="row">${avatar(target)}<div class="grow"><b>${esc(target.name)}</b><div class="muted">@${esc(target.username)}</div></div><button class="btn" onclick="activeChat='';messages()">Fermer</button></div><div id="chatThread" style="min-height:120px;max-height:42vh;overflow:auto;padding:12px 0">${thread.length?thread.map(m=>`<div style="display:flex;justify-content:${m.from===current?'flex-end':'flex-start'};margin:8px 0"><div style="max-width:82%;padding:10px 13px;border-radius:15px;background:${m.from===current?'var(--gold)':'var(--surface2)'};color:${m.from===current?'#211909':'var(--text)'}"><div>${esc(m.text)}</div><div style="font-size:10px;opacity:.7;margin-top:5px">${new Date(m.created).toLocaleString('fr-FR')}</div>${m.from===current?`<button class="btn" style="margin-top:6px;padding:4px 8px;font-size:11px" onclick="deleteChatMessage('${m.id}')">Supprimer</button>`:''}</div></div>`).join(''):'<p class="empty">Dites bonjour pour commencer la conversation.</p>'}</div><textarea class="field" id="chatText" placeholder="Écrire un message…" style="min-height:65px"></textarea><button class="btn primary" style="width:100%" onclick="sendChat()">Envoyer ➤</button></div>`:`<div class="card empty"><div class="star">✉</div><h3>Choisissez un membre</h3><p>Recherchez un ami ci-dessus pour ouvrir une conversation.</p></div>`}<p class="note">⚠️ Messagerie de démonstration locale : les messages sont enregistrés uniquement dans ce navigateur. Pour échanger avec tes amis depuis leurs propres téléphones, J-Connect doit être relié à un serveur en ligne sécurisé.</p>`;applyTheme()}

function showUndoToast(message){document.getElementById('jcUndoToast')?.remove();const el=document.createElement('div');el.id='jcUndoToast';el.style.cssText='position:fixed;z-index:10050;left:12px;right:12px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:auto;background:var(--surface);color:var(--text);border:1px solid var(--gold);border-radius:16px;padding:13px 14px;box-shadow:0 12px 35px #0008;display:flex;align-items:center;gap:10px';el.innerHTML='<span style="flex:1;font-size:13px">'+esc(message)+'</span><button class="btn primary" onclick="undoLastTrash()">ANNULER</button><button class="btn" aria-label="Fermer" onclick="this.parentElement.remove()">×</button>';document.body.appendChild(el);window.setTimeout(()=>el.remove(),9000)}
function undoLastTrash(){const item=(db.trash||[]).find(x=>x.user===current);if(!item)return alert('Aucun élément à restaurer.');restoreTrash(item.id)}
function restoreTrash(id){const t=(db.trash||[]).find(x=>x.id===id&&x.user===current);if(!t)return alert('Élément introuvable dans la corbeille.');if(t.type==='post'){db.posts=db.posts||[];if(!db.posts.some(x=>x.id===t.item.id))db.posts.unshift(t.item)}else if(t.type==='story'){db.stories=db.stories||[];if(!db.stories.some(x=>x.id===t.item.id))db.stories.unshift(t.item)}else if(t.type==='message'){db.messages=db.messages||[];if(!db.messages.some(x=>x.id===t.item.id))db.messages.unshift(t.item)}else if(t.type==='video'){db.videos=db.videos||[];if(!db.videos.some(x=>x.id===t.item.id))db.videos.unshift(t.item)}db.trash=db.trash.filter(x=>x.id!==id);if(!save())return;document.getElementById('jcUndoToast')?.remove();if(view==='profile')profile();else if(view==='messages')messages();else if(view==='discover')discover();else home();showUndoToast('Contenu restauré avec succès.');}
function emptyTrashItem(id){const t=(db.trash||[]).find(x=>x.id===id&&x.user===current);if(!t)return;if(!confirm('Effacer définitivement cet élément ? Cette action ne pourra pas être annulée.'))return;db.trash=db.trash.filter(x=>x.id!==id);if(!save())return;profile()}

function memberRows(){
 let list=db.users.filter(u=>u.role!=='owner').sort((a,b)=>(b.created||0)-(a.created||0));
 let q=memberQuery.toLowerCase();
 let shown=list.filter(u=>[u.name,u.username,u.phone,u.createdByLabel].some(v=>String(v||'').toLowerCase().includes(q)));
 return shown.length?shown.map(u=>`<div class="row" style="padding:11px 0;border-bottom:1px solid var(--line)">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)} · ${esc(u.phone||'Téléphone non fourni')}</div><div class="muted">Créé le : ${u.created?new Date(u.created).toLocaleString('fr-FR'):'Date inconnue'}</div><div class="muted">Créateur / origine : <b>${esc(u.createdByLabel||'Non renseigné')}</b></div><div class="muted">Statut : ${u.blocked?'Bloqué':'Actif'}</div></div><button class="btn ${u.blocked?'':'danger'}" onclick="toggleMemberBlock('${u.id}')">${u.blocked?'Débloquer':'Bloquer'}</button></div>`).join(''):`<div class="empty"><div class="star">♙</div><h3>${q?'Aucun résultat':'Aucun membre pour le moment'}</h3><p>Les comptes créés sur cet appareil apparaîtront ici.</p></div>`;
}
function filterMembers(value){memberQuery=value;let box=document.getElementById('memberList');if(box)box.innerHTML=memberRows()}
function members(){if(me()?.role!=='owner'){view='home';return home()}let count=db.users.filter(u=>u.role!=='owner').length,total=db.users.length;document.getElementById('main').innerHTML=`<div class="split"><h2 class="sectiontitle">Membres inscrits</h2><span class="pill">${count} membre(s)</span></div><div class="row" style="gap:8px;margin:12px 0"><div class="card grow" style="margin:0;text-align:center"><b style="font-size:26px;color:var(--gold2)">${total}</b><div class="muted">Comptes au total</div></div><div class="card grow" style="margin:0;text-align:center"><b style="font-size:26px;color:var(--gold2)">${count}</b><div class="muted">Membres</div></div></div><div class="card"><div class="eyebrow">TABLEAU DE BORD PROPRIÉTAIRE · V20</div><p class="note">Les nouveaux comptes créés sur cette installation sont ajoutés ici. Actualisation automatique entre onglets du même navigateur.</p><input class="field" id="memberSearch" placeholder="Rechercher un nom, identifiant ou téléphone" value="${esc(memberQuery)}" oninput="filterMembers(this.value)"><div id="memberList">${memberRows()}</div></div><button class="btn" onclick="members()">Actualiser la liste</button><p class="note">Confidentialité : les mots de passe ne sont jamais affichés. Cette liste locale n'est pas encore partagée entre téléphones.</p>`;applyTheme()}
function toggleMemberBlock(id){if(me()?.role!=='owner')return;let u=db.users.find(x=>x.id===id&&x.role!=='owner');if(!u)return;u.blocked=!u.blocked;save();members()}
window.addEventListener('storage',e=>{if(e.key===KEY){db=load();if(me()?.role==='owner'&&view==='members')members();else if(view==='profile')profile()}});
function profilePhoto(input){let f=input.files[0];if(!f)return;if(f.size>2*1024*1024)return alert('Photo trop lourde (maximum 2 Mo).');let r=new FileReader();r.onload=()=>{me().photo=r.result;save();profile()};r.readAsDataURL(f)}
function saveProfile(){let u=me();u.name=document.getElementById('pName').value.trim()||u.name;let un=document.getElementById('pUsername');if(un&&!un.readOnly){let next=un.value.trim().replace(/^@/,'').toLowerCase();if(next&&db.users.some(x=>x.id!==u.id&&x.username===next))return alert('Cet identifiant est déjà utilisé.');if(next)u.username=next}let em=document.getElementById('pEmail');u.email=em?em.value.trim():u.email;u.bio=document.getElementById('pBio').value.trim();u.city=document.getElementById('pCity').value.trim();u.school=document.getElementById('pSchool').value.trim();if(!save())return;alert('Ton profil a été mis à jour sur cet appareil.');profile()}

function updateBadgePrice(){const prices={monthly:'10 000 FC',quarterly:'25 000 FC',semester:'53 000 FC'};const el=document.getElementById('badgePrice'),plan=document.getElementById('subscriptionPlan')?.value;if(el)el.textContent='Montant à payer : '+(prices[plan]||prices.monthly)}
function submitMpesaSubscription(){
 const u=me(),plan=document.getElementById('subscriptionPlan')?.value,ref=document.getElementById('mpesaRef')?.value.trim(),payer=document.getElementById('mpesaName')?.value.trim();
 if(!u||!plan||!ref||!payer)return alert('Renseigne le nom du payeur et la référence M-Pesa.');
 if(ref.length<5)return alert('Vérifie la référence de transaction M-Pesa.');
 const prices={monthly:10000,quarterly:25000,semester:53000};u.subscription={plan,amount:prices[plan]||10000,currency:'CDF',payer,reference:ref,recipient:'+243816997217',status:'pending',submitted:Date.now()};
 if(!save())return;
 alert('Demande enregistrée. Elle reste en attente de vérification du paiement par le propriétaire.');
 profile();
}
function subscriptionRequests(){
 if(me()?.role!=='owner')return alert('Accès réservé au propriétaire.');
 const list=db.users.filter(u=>u.subscription?.status==='pending');
 document.getElementById('main').innerHTML=`<h2 class="sectiontitle">Demandes M-Pesa</h2><div class="card"><p class="note">Vérifie chaque transaction dans le compte M-Pesa destinataire avant d’approuver. Ne valide pas sur la seule base d’une capture d’écran.</p>${list.length?list.map(u=>`<div class="plan-card"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)} · ${esc(u.subscription.plan)} · ${Number(u.subscription.amount||0).toLocaleString('fr-FR')} FC · ${esc(u.subscription.payer)}</div><div>Référence : <b>${esc(u.subscription.reference)}</b></div><div class="muted">Soumis le ${new Date(u.subscription.submitted).toLocaleString('fr-FR')}</div><button class="btn primary" onclick="approveSubscription('${u.id}')">Confirmer après vérification</button></div>`).join(''):'<p class="empty">Aucune demande en attente.</p>'}</div><button class="btn" onclick="profile()">Retour au profil</button>`;applyTheme();
}
function approveSubscription(id){
 if(me()?.role!=='owner')return;
 const u=db.users.find(x=>x.id===id&&x.subscription?.status==='pending');if(!u)return;
 const months={monthly:1,quarterly:3,semester:6}[u.subscription.plan]||1;
 const d=new Date();d.setMonth(d.getMonth()+months);
 u.subscription.status='active';u.subscription.approved=Date.now();u.subscription.until=d.getTime();u.subscription.approvedBy=current;
 save();subscriptionRequests();
}

<div class="card"><h3>☁️ Connexion en ligne</h3><p class="note">Pour synchroniser les comptes, publications, messages, réglages et blocages entre téléphones, J-Connect doit être relié à Firebase avec authentification, base de données et règles de sécurité correctement configurées.</p><div class="pill">État : en attente de configuration Firebase</div><p class="muted" style="margin-top:12px">Identifiant du projet Firebase</p><input class="field" id="fbProject" placeholder="ex. j-connect-xxxxx"><p class="muted">Clé API Web</p><input class="field" id="fbApi" placeholder="AIza..." autocomplete="off"><p class="muted">Domaine d’authentification</p><input class="field" id="fbAuth" placeholder="votre-projet.firebaseapp.com"><p class="muted">ID de l’application (appId)</p><input class="field" id="fbApp" placeholder="1:...:web:..."><button class="btn primary" style="width:100%" onclick="saveFirebaseSetup()">Enregistrer les paramètres du projet</button><p id="fbStatus" class="note" aria-live="polite"></p><p class="note">Ne partage jamais de mot de passe administrateur ni de clé privée de service.</p><button class="btn" style="width:100%" onclick="downloadFirebaseGuide()">Télécharger le guide de configuration</button></div>
<div class="card"><h3>💾 Stockage et données</h3><div class="actions"><button class="btn" onclick="exportData()">Télécharger une sauvegarde</button><button class="btn danger" onclick="clearLocal()">Effacer les données locales</button></div><p class="note">Exporte une sauvegarde avant d’effacer les données. L’effacement local ne supprime pas d’éventuelles données sur un futur serveur.</p></div>
<p class="note">Les réglages qui nécessitent un serveur sont présentés comme préférences pour l’instant : ils ne sont pas encore des protections actives contre les autres utilisateurs.</p>`;applyTheme()}
function updateSetting(key,value){db.settings=db.settings||{};db.settings[key]=value;save();settings()}
function saveFirebaseSetup(){const cfg={projectId:document.getElementById('fbProject')?.value.trim(),apiKey:document.getElementById('fbApi')?.value.trim(),authDomain:document.getElementById('fbAuth')?.value.trim(),appId:document.getElementById('fbApp')?.value.trim()};if(!cfg.projectId||!cfg.apiKey||!cfg.authDomain||!cfg.appId){document.getElementById('fbStatus').textContent='Complète les quatre champs à partir de la configuration de ton application Web Firebase.';return}localStorage.setItem('jconnect_firebase_setup',JSON.stringify(cfg));document.getElementById('fbStatus').textContent='Configuration enregistrée sur cet appareil. La connexion cloud n’est pas encore activée : il faut encore installer les règles Firestore et brancher Auth/Firestore.';}
function downloadFirebaseGuide(){const guide=`J-CONNECT V16 — CONFIGURATION FIREBASE\n\n1. Crée un projet sur https://console.firebase.google.com/ avec ton propre compte Google.\n2. Ajoute une application Web et récupère apiKey, authDomain, projectId et appId.\n3. Active Authentication > Sign-in method > Email/Password.\n4. Crée une base Firestore en mode production.\n5. Configure les règles de sécurité avant tout test public.\n6. Ajoute les domaines d’hébergement autorisés dans Authentication > Settings.\n\nIMPORTANT : V16 prépare la saisie des paramètres, mais ne synchronise pas encore les comptes ou messages sur Internet. Ne publie pas l’application auprès de tes amis avant l’intégration et le test de l’authentification, des profils, des conversations et des règles de sécurité.\n\nLe fichier firebase-config.example.js fourni est un modèle, pas une clé active.\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([guide],{type:'text/plain'}));a.download='J-Connect-V16-guide-Firebase.txt';a.click();URL.revokeObjectURL(a.href)}
function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='j-connect-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function clearLocal(){if(!confirm('Supprimer les données J-Connect de cet appareil ? Cette action est irréversible.'))return;localStorage.removeItem(KEY);localStorage.removeItem(SESSION);db=load();current='';render()}
function logout(){if(me()?.role==='owner')return alert('Le compte propriétaire est déjà configuré automatiquement sur cet appareil.');current='';localStorage.removeItem(SESSION);render()}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* J-CONNECT V20 — réseau social local */
db.friendRequests=Array.isArray(db.friendRequests)?db.friendRequests:[];
db.friends=Array.isArray(db.friends)?db.friends:[];
db.follows=Array.isArray(db.follows)?db.follows:[];
db.groups=Array.isArray(db.groups)?db.groups:[];
db.groupMessages=Array.isArray(db.groupMessages)?db.groupMessages:[];
let viewedProfile='',activeGroup='';
function isFriend(a,b){return db.friends.some(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a))}
function isFollowing(a,b){return db.follows.some(x=>x.from===a&&x.to===b)}
function isBlocked(a,b){return !!(db.users.find(x=>x.id===a)?.blockedUsers||[]).includes(b)||!!(db.users.find(x=>x.id===b)?.blockedUsers||[]).includes(a)}
function profileOf(id){
 let u=db.users.find(x=>x.id===id);if(!u)return alert("Compte introuvable.");viewedProfile=id;
 let own=id===current,posts=db.posts.filter(p=>p.user===id).sort((a,b)=>b.created-a.created);
 let nf=db.friends.filter(x=>x.a===id||x.b===id).length,nfo=db.follows.filter(x=>x.to===id).length,nfi=db.follows.filter(x=>x.from===id).length;
 let req=db.friendRequests.some(x=>x.from===current&&x.to===id),incoming=db.friendRequests.some(x=>x.from===id&&x.to===current);
 let blocked=(me().blockedUsers||[]).includes(id),friend=isFriend(current,id),following=isFollowing(current,id);
 document.getElementById('main').innerHTML=`<button class="btn" onclick="go('discover')">← Retour</button><section class="card">
 <div class="profile-cover"></div><div style="display:flex;justify-content:center">${avatar(u)}</div><div style="text-align:center"><h2>${esc(u.name)}${pantherBadge(u)}</h2><div class="muted">@${esc(u.username)}</div><p>${esc(u.bio||'Aucune biographie.')}</p><span class="pill">📍 ${esc(u.city||'Ville non précisée')}</span></div>
 <div class="statgrid"><button class="statbox" onclick="relationList('${id}','friends')"><b>${nf}</b><span>Amis</span></button><button class="statbox" onclick="relationList('${id}','followers')"><b>${nfo}</b><span>Abonnés</span></button><button class="statbox" onclick="relationList('${id}','following')"><b>${nfi}</b><span>Abonnements</span></button></div>
 ${own?'<button class="btn primary" style="width:100%" onclick="go(&quot;profile&quot;)">Modifier mon compte</button>':blocked?`<button class="btn" onclick="unblockUser('${id}')">Débloquer</button>`:`<div class="actions"><button class="btn primary" onclick="${friend?`removeFriend('${id}')`:req?`cancelRequest('${id}')`:incoming?`acceptRequest('${id}')`:`sendRequest('${id}')`}">${friend?'Retirer des amis':req?'Invitation envoyée':incoming?'Accepter':'Ajouter en ami'}</button><button class="btn" onclick="toggleFollow('${id}')">${following?'✓ Abonné':'＋ Suivre'}</button><button class="btn" onclick="startChat('${id}')">✉ Message</button><button class="btn danger" onclick="blockUser('${id}')">Bloquer</button></div>`}
 </section><h3 class="sectionlabel">Publications</h3>${posts.length?postCards(posts):'<div class="card empty">Aucune publication.</div>'}`;
}
function sendRequest(id){if(id===current||isBlocked(current,id)||isFriend(current,id))return;if(!db.friendRequests.some(x=>x.from===current&&x.to===id))db.friendRequests.push({id:crypto.randomUUID(),from:current,to:id,created:Date.now()});save();profileOf(id)}
function cancelRequest(id){db.friendRequests=db.friendRequests.filter(x=>!(x.from===current&&x.to===id));save();profileOf(id)}
function acceptRequest(id){let r=db.friendRequests.find(x=>x.from===id&&x.to===current);if(!r)return;db.friendRequests=db.friendRequests.filter(x=>x.id!==r.id);if(!isFriend(current,id))db.friends.push({a:current,b:id,created:Date.now()});save();profileOf(id)}
function ignoreRequest(id){db.friendRequests=db.friendRequests.filter(x=>!(x.from===id&&x.to===current));save();discover()}
function removeFriend(id){db.friends=db.friends.filter(x=>!((x.a===current&&x.b===id)||(x.a===id&&x.b===current)));save();profileOf(id)}
function toggleFollow(id){if(isFollowing(current,id))db.follows=db.follows.filter(x=>!(x.from===current&&x.to===id));else if(id!==current&&!isBlocked(current,id))db.follows.push({from:current,to:id,created:Date.now()});save();profileOf(id)}
function blockUser(id){if(!confirm("Bloquer ce membre ?"))return;me().blockedUsers=me().blockedUsers||[];if(!me().blockedUsers.includes(id))me().blockedUsers.push(id);db.friends=db.friends.filter(x=>!((x.a===current&&x.b===id)||(x.a===id&&x.b===current)));db.follows=db.follows.filter(x=>!(x.from===current&&x.to===id));save();profileOf(id)}
function unblockUser(id){me().blockedUsers=(me().blockedUsers||[]).filter(x=>x!==id);save();profileOf(id)}
function relationList(id,type){let ids=type==='friends'?db.friends.filter(x=>x.a===id||x.b===id).map(x=>x.a===id?x.b:x.a):type==='followers'?db.follows.filter(x=>x.to===id).map(x=>x.from):db.follows.filter(x=>x.from===id).map(x=>x.to);let title=type==='friends'?'Amis':type==='followers'?'Abonnés':'Abonnements';document.getElementById('main').innerHTML=`<button class="btn" onclick="profileOf('${id}')">← Profil</button><h2>${title} (${ids.length})</h2><div class="card">${ids.map(pid=>{let u=db.users.find(x=>x.id===pid);return u?`<div class="personrow">${avatar(u)}<div class="grow">${esc(u.name)}<div class="muted">@${esc(u.username)}</div></div><button class="btn" onclick="profileOf('${pid}')">Voir</button></div>`:''}).join('')||'<p class="empty">Aucun membre.</p>'}</div>`}
function discoverMembersLegacy(){let people=db.users.filter(u=>u.id!==current&&!u.blocked&&!(me().blockedUsers||[]).includes(u.id)),incoming=db.friendRequests.filter(x=>x.to===current);document.getElementById('main').innerHTML=`<h2 class="sectiontitle">Amis & membres</h2><div class="card"><h3>🔎 Rechercher un compte par photo</h3><p class="muted">Choisissez une photo pour comparer avec les photos de profil et les publications enregistrées dans cette version.</p><input class="field" id="photoQuery" type="file" accept="image/*" onchange="searchByPhoto(this)"><div id="photoSearchResult"></div><p class="note">La recherche est locale et approximative. Elle ne cherche pas sur Internet ni sur les téléphones d'autres personnes.</p></div>${incoming.length?`<div class="card"><h3>Invitations reçues (${incoming.length})</h3>${incoming.map(r=>{let u=db.users.find(x=>x.id===r.from);return u?`<div class="personrow">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div><button class="btn primary" onclick="acceptRequest('${u.id}')">Accepter</button><button class="btn" onclick="ignoreRequest('${u.id}')">Ignorer</button></div>`:''}).join('')}</div>`:''}<div class="card"><input class="field" placeholder="Rechercher un nom ou identifiant" oninput="filterPeople(this.value)"><div id="peopleList">${peopleList(people)}</div></div>`}
function peopleList(a){return a.map(u=>`<div class="personrow">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)} ${isFriend(current,u.id)?'· Ami':''}</div></div><button class="btn" onclick="profileOf('${u.id}')">Voir le compte</button></div>`).join('')||'<p class="empty">Aucun membre.</p>'}
function filterPeople(q){q=q.toLowerCase();let a=db.users.filter(u=>u.id!==current&&!u.blocked&&!(me().blockedUsers||[]).includes(u.id)&&(u.name+' '+u.username).toLowerCase().includes(q));document.getElementById('peopleList').innerHTML=peopleList(a)}
function groups(){db.groups=db.groups||[];let mine=db.groups.filter(g=>(g.members||[]).includes(current));document.getElementById('main').innerHTML=`<h2 class="sectiontitle">Groupes & communautés</h2><div class="card"><h3>＋ Créer un groupe</h3><input class="field" id="groupName" placeholder="Nom du groupe"><textarea class="field" id="groupDesc" placeholder="Description"></textarea><button class="btn primary" style="width:100%" onclick="createGroup()">Créer le groupe</button></div><h3 class="sectionlabel">Mes groupes (${mine.length})</h3>${mine.map(g=>`<button class="card" style="width:100%;text-align:left;color:var(--text)" onclick="openGroup('${g.id}')"><b>◎ ${esc(g.name)}</b><div class="muted">${g.members.length} membre(s) · ${esc(g.description||'')}</div></button>`).join('')||'<div class="card empty">Aucun groupe pour le moment.</div>'}<h3 class="sectionlabel">Autres groupes</h3>${db.groups.filter(g=>!(g.members||[]).includes(current)).map(g=>`<div class="card"><b>${esc(g.name)}</b><p>${esc(g.description||'')}</p><button class="btn primary" onclick="joinGroup('${g.id}')">Rejoindre</button></div>`).join('')}`}

function createGroup(){let name=document.getElementById('groupName').value.trim(),description=document.getElementById('groupDesc').value.trim();if(!name)return alert("Indiquez le nom du groupe.");db.groups=db.groups||[];let g={id:crypto.randomUUID?crypto.randomUUID():('grp_'+Date.now()+'_'+Math.random().toString(36).slice(2)),name,description,owner:current,admins:[],members:[current],writeMode:'all',created:Date.now()};db.groups.push(g);if(!save())return;openGroup(g.id)}
function joinGroup(id){let g=db.groups.find(x=>x.id===id);if(g&&!g.members.includes(current))g.members.push(current);save();openGroup(id)}
function isGroupAdmin(g){return g.owner===current||(g.admins||[]).includes(current)}
function openGroup(id){let g=db.groups.find(x=>x.id===id);if(!g||!g.members.includes(current))return;g.admins=g.admins||[];g.writeMode=g.writeMode||'all';activeGroup=id;let ms=(db.groupMessages||[]).filter(x=>x.group===id&&!(x.deletedFor||[]).includes(current)).sort((a,b)=>a.created-b.created);let admin=isGroupAdmin(g);document.getElementById('main').innerHTML=`<button class="btn" onclick="go('groups')">← Groupes</button><div class="card"><h2>${esc(g.name)}</h2><div class="muted">${g.members.length} membre(s) · ${esc(g.description||'')}</div><div style="max-height:45vh;overflow:auto;padding:10px 0">${ms.map(m=>{let u=db.users.find(x=>x.id===m.from);return `<div class="groupbubble ${m.from===current?'mine':''}"><b>${esc(u?.name||'Membre')}</b><div>${m.deletedForAll?`<i>🚫 ${esc(m.deletedLabel||((u?.name||'Membre')+' a retiré le message'))}</i>`:esc(m.text)}</div>${!m.deletedForAll?`<small>${new Date(m.created).toLocaleString('fr-FR')} ${m.from===current?` · <button class="btn" onclick="removeGroupMessage('${m.id}','me')">Supprimer pour moi</button> <button class="btn" onclick="removeGroupMessage('${m.id}','all')">Supprimer pour tous</button>`:''}</small>`:''}</div>`}).join('')||'<p class="empty">Démarrez la discussion !</p>'}</div>${(g.writeMode==='admins'&&!admin)?'<p class="note">Seuls les administrateurs peuvent écrire dans ce groupe.</p>':`<textarea class="field" id="groupText" placeholder="Écrire au groupe…"></textarea><button class="btn primary" style="width:100%" onclick="sendGroup('${id}')">Envoyer ➤</button>`}${admin?`<hr><h3>⚙ Administration du groupe</h3><label class="muted">Qui peut écrire ?</label><select class="field" onchange="setGroupWriteMode('${id}',this.value)"><option value="all" ${g.writeMode==='all'?'selected':''}>Tous les membres</option><option value="admins" ${g.writeMode==='admins'?'selected':''}>Administrateurs seulement</option></select><h4>Nommer / retirer des administrateurs</h4>${g.members.map(uid=>{let u=db.users.find(x=>x.id===uid);return `<div class="personrow">${avatar(u)}<div class="grow">${esc(u?.name||'Membre')} ${uid===g.owner?'👑 Propriétaire':''} ${(g.admins||[]).includes(uid)?'· Admin':''}</div>${uid!==g.owner?`<button class="btn" onclick="toggleGroupAdmin('${id}','${uid}')">${(g.admins||[]).includes(uid)?'Retirer admin':'Nommer admin'}</button>`:''}${uid!==g.owner?`<button class="btn" onclick="removeGroupMember('${id}','${uid}')">Retirer membre</button>`:''}</div>`}).join('')}<button class="btn delete-option" style="width:100%;margin-top:12px" onclick="deleteGroup('${id}')">🗑 Supprimer le groupe</button><h4>Ajouter des membres</h4>${db.users.filter(u=>u.id!==current&&!g.members.includes(u.id)).map(u=>`<div class="personrow">${avatar(u)}<div class="grow">${esc(u.name)}</div><button class="btn" onclick="addGroupMember('${id}','${u.id}')">Ajouter</button></div>`).join('')}`:''}</div>`}
function setGroupWriteMode(id,mode){let g=db.groups.find(x=>x.id===id);if(!g||!isGroupAdmin(g))return;g.writeMode=mode;save();openGroup(id)}
function toggleGroupAdmin(id,uid){let g=db.groups.find(x=>x.id===id);if(!g||!isGroupAdmin(g))return;g.admins=g.admins||[];g.admins=g.admins.includes(uid)?g.admins.filter(x=>x!==uid):[...g.admins,uid];save();openGroup(id)}
function removeGroupMember(id,uid){let g=db.groups.find(x=>x.id===id);if(!g||!isGroupAdmin(g)||uid===g.owner)return;if(!confirm('Retirer ce membre du groupe ?'))return;g.members=g.members.filter(x=>x!==uid);g.admins=(g.admins||[]).filter(x=>x!==uid);save();openGroup(id)}
function deleteGroup(id){let g=db.groups.find(x=>x.id===id);if(!g||!isGroupAdmin(g))return;if(!confirm('Supprimer définitivement ce groupe et ses messages ?'))return;db.groups=db.groups.filter(x=>x.id!==id);db.groupMessages=(db.groupMessages||[]).filter(x=>x.group!==id);save();activeGroup='';groups()}
function removeGroupMessage(id,scope){let m=(db.groupMessages||[]).find(x=>x.id===id&&x.group===activeGroup);if(!m||m.from!==current)return;if(scope==='all'){if(!confirm('Retirer ce message pour tous les membres ?'))return;let author=me()?.name||'Jordi';m.deletedForAll=true;m.deletedLabel=author+' a retiré le message';m.text=''}else{m.deletedFor=m.deletedFor||[];if(!m.deletedFor.includes(current))m.deletedFor.push(current)}save();openGroup(activeGroup)}

function sendGroup(id){let g=db.groups.find(x=>x.id===id);if(!g||!g.members.includes(current))return;if(g.writeMode==='admins'&&!isGroupAdmin(g))return alert('Seuls les administrateurs peuvent écrire.');let t=document.getElementById('groupText')?.value.trim();if(!t)return;db.groupMessages.push({id:crypto.randomUUID(),group:id,from:current,text:t,created:Date.now()});save();openGroup(id)}

function messages(){let people=db.users.filter(u=>u.id!==current&&!u.blocked&&!(me().blockedUsers||[]).includes(u.id)),q=(window.chatSearch||'').toLowerCase(),shown=people.filter(u=>(u.name+' '+u.username).toLowerCase().includes(q)),target=db.users.find(u=>u.id===activeChat&&!isBlocked(current,activeChat)),thread=target?chatMessages(activeChat):[],ids=[...new Set(db.messages.filter(m=>m.from===current||m.to===current).map(m=>m.from===current?m.to:m.from))];document.getElementById('main').innerHTML=`<h2 class="sectiontitle">Messagerie</h2><div class="card"><h3>Conversations</h3>${ids.map(id=>{let u=db.users.find(x=>x.id===id);return u?`<div class="personrow">${avatar(u)}<div class="grow">${esc(u.name)}</div><button class="btn" onclick="startChat('${id}')">Ouvrir</button></div>`:''}).join('')||'<p class="muted">Aucune conversation.</p>'}</div><div class="card"><h3>Écrire à un membre</h3><input class="field" placeholder="Rechercher" value="${esc(window.chatSearch||'')}" oninput="window.chatSearch=this.value;messages()">${shown.map(u=>`<div class="personrow">${avatar(u)}<div class="grow">${esc(u.name)}<div class="muted">@${esc(u.username)}</div></div><button class="btn primary" onclick="startChat('${u.id}')">Écrire</button></div>`).join('')}</div>${target?`<div class="card"><div class="row">${avatar(target)}<div class="grow"><b>${esc(target.name)}</b></div><button class="btn" onclick="profileOf('${target.id}')">Profil</button><button class="btn" onclick="activeChat='';messages()">Fermer</button></div><div style="max-height:42vh;overflow:auto;padding:12px 0">${thread.map(m=>`<div style="display:flex;justify-content:${m.from===current?'flex-end':'flex-start'};margin:8px 0"><div class="groupbubble msg-bubble ${m.from===current?'mine':''}" role="button" tabindex="0" aria-label="Options du message" onclick="openMessageMenu('${m.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMessageMenu('${m.id}')}" oncontextmenu="event.preventDefault(); let voiceRecorder=null,voiceChunks=[];
async function startVoiceNote(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert('Les notes vocales ne sont pas prises en charge par ce navigateur. Essaie un navigateur récent en HTTPS.');return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});voiceChunks=[];const recorder=new MediaRecorder(stream);voiceRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(voiceChunks,{type:recorder.mimeType||'audio/webm'});if(blob.size>3*1024*1024){stream.getTracks().forEach(t=>t.stop());alert('Note vocale trop volumineuse. Essaie un enregistrement plus court.');return;}const reader=new FileReader();reader.onload=()=>{db.messages.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),from:current,to:activeChat,text:'Note vocale',attachment:{kind:'audio',name:'note-vocale.webm',mime:blob.type,data:reader.result},created:Date.now()});try{save()}catch(e){alert('Le stockage local est plein. Essaie une note plus courte.');}stream.getTracks().forEach(t=>t.stop());messages()};reader.readAsDataURL(blob);const btn=document.getElementById('voiceRecordBtn');if(btn){btn.textContent='🎙️ Note vocale';btn.onclick=startVoiceNote;}};recorder.start();const btn=document.getElementById('voiceRecordBtn');if(btn){btn.textContent='⏹️ Arrêter et envoyer';btn.onclick=stopVoiceNote;}window.voiceNoteTimeout=setTimeout(()=>{if(voiceRecorder===recorder&&recorder.state!=='inactive')stopVoiceNote()},60000);}catch(e){alert('Autorise le microphone dans ton navigateur pour enregistrer une note vocale.')}}
function stopVoiceNote(){if(window.voiceNoteTimeout)clearTimeout(window.voiceNoteTimeout);const recorder=voiceRecorder;voiceRecorder=null;if(recorder&&recorder.state!=='inactive')recorder.stop()}

 if(!target){
  const rows=list.map(u=>{const ms=chatMessages(u.id),last=ms[ms.length-1];return `<div class="chat-person" onclick="startChat('${u.id}')">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="lastline">${last?(last.from===current?'Vous : ':'')+(last.sticker?'🐆 Sticker':esc(last.text)):'Touchez pour commencer à discuter'}</div></div><small>${last?new Date(last.created).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):''}</small></div>`}).join('');
  main.innerHTML=`<h2 class="sectiontitle">Messages · J-Connect</h2><div class="chat-inbox"><div class="chat-inbox-head"><h3 style="margin:0 0 12px">💬 Discussions</h3><input class="field chat-search" placeholder="Rechercher une conversation ou un membre" value="${esc(window.chatSearch||'')}" oninput="window.chatSearch=this.value;messages()"></div>${rows||'<div class="chat-empty">Aucune discussion pour le moment.<br>Choisis un membre ci-dessous pour lui écrire.</div>'}</div><div class="card" style="margin-top:14px"><h3>Commencer une discussion</h3><div>${available.map(u=>`<div class="chat-person" onclick="startChat('${u.id}')">${avatar(u)}<div class="grow"><b>${esc(u.name)}</b><div class="lastline">@${esc(u.username)}</div></div><button class="btn primary" onclick="event.stopPropagation();startChat('${u.id}')">Message</button></div>`).join('')||'<p class="muted">Aucun membre trouvé.</p>'}</div></div><p class="note">Sélectionne un membre pour ouvrir une conversation privée.</p>`;
  return;
 }
 const thread=chatMessages(activeChat);
 const bubbles=thread.map(m=>`<div style="display:flex;justify-content:${m.from===current?'flex-end':'flex-start'};margin:7px 0"><div class="bubble ${m.from===current?'mine':'theirs'}" role="button" tabindex="0" aria-label="Options du message" onclick="openMessageMenu('${m.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMessageMenu('${m.id}')}" oncontextmenu="event.preventDefault();openMessageMenu('${m.id}')">${m.forwarded?'<small style="display:block;opacity:.7">↗ Transféré</small>':''}${m.attachment?.kind==='image'?`<img class="chat-message-image" src="${m.attachment.data}" alt="${esc(m.attachment.name)}">`:m.attachment?.kind==='audio'?`<div class="voice-note"><button onclick="playVoiceNote('${m.id}')">▶</button><span>🎙️ Note vocale</span></div>`:m.attachment?`<a class="chat-file-card" href="${m.attachment.data}" download="${esc(m.attachment.name)}"><span style="font-size:26px">📎</span><span><strong>${esc(m.attachment.name)}</strong><small>Fichier joint · télécharger</small></span></a>`:m.sticker?`<div class="sticker-message">${esc(m.text)}</div>`:esc(m.text)}${m.reactions&&Object.values(m.reactions).length?`<small style="display:block">${Object.values(m.reactions).map(esc).join(' ')}</small>`:''}<small style="display:block;text-align:right;font-size:10px;opacity:.65;margin-top:4px">${new Date(m.created).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('');
 main.innerHTML=`<section class="chat-screen"><header class="chat-topbar"><button class="chat-back" onclick="activeChat='';messages()" aria-label="Retour aux discussions">‹</button><div class="chat-peer" onclick="openChatPeerProfile('${target.id}')" role="button" aria-label="Ouvrir le profil de ${esc(target.name)}">${avatar(target)}<div class="grow"><b>${esc(target.name)}</b><div class="muted" style="font-size:12px">@${esc(target.username)} · Profil</div></div></div><button class="chat-call-btn" onclick="openChatCall('audio')" aria-label="Appel audio" title="Appel audio">📞</button><button class="chat-call-btn" onclick="openChatCall('video')" aria-label="Appel vidéo" title="Appel vidéo">▣</button><button class="chat-call-btn" onclick="openChatPeerProfile('${target.id}')" aria-label="Options du contact" title="Profil et options">⋮</button></header><div class="chat-thread" id="chatThread">${bubbles||'<div class="chat-empty">🔒<br>Cette conversation est prête.<br>Envoie le premier message !</div>'}</div><div class="chat-compose"><input id="chatImageInput" type="file" accept="image/*" hidden onchange="handleChatAttachment(this,'image')"><input id="chatFileInput" type="file" hidden onchange="handleChatAttachment(this,'file')"><div class="compose-row"><button class="compose-icon" onclick="chooseChatAttachment('image')" aria-label="Envoyer une photo" title="Photo">▧</button><button class="compose-icon" onclick="chooseChatAttachment('file')" aria-label="Envoyer un fichier" title="Fichier">📎</button><button class="compose-icon" onclick="startVoiceNote()" aria-label="Enregistrer une note vocale" title="Note vocale">🎙️</button><textarea class="field compose-input" id="chatText" placeholder="Message…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}" ></textarea><button class="compose-icon" onclick="toggleChatPanel('keyboardDrawer');showChatDrawer('emoji')" aria-label="Emojis" title="Emojis">😊</button><button class="compose-icon" onclick="toggleChatPanel('keyboardDrawer');showChatDrawer('stickers')" aria-label="Stickers" title="Stickers">🐆</button><button class="send-round" onclick="sendChat()" aria-label="Envoyer">➤</button></div><div class="chat-attach-menu"><button onclick="chooseChatAttachment('image')">🖼️ Photo / vidéo</button><button onclick="chooseChatAttachment('file')">📁 Document</button><button id="voiceRecordBtn" onclick="startVoiceNote()">🎙️ Note vocale</button></div><div id="keyboardDrawer" class="keyboard-drawer" hidden><div class="drawer-tabs"><button id="emojiTab" onclick="showChatDrawer('emoji')">😊 Emojis</button><button id="stickerTab" onclick="showChatDrawer('stickers')">🐆 Stickers</button></div><div id="drawerEmoji"><div class="emoji-grid">${'😀 😃 😄 😁 😆 😅 😂 🙂 🙃 😉 😊 😍 🥰 😘 😎 🤩 🥳 😭 😢 😡 🤔 🙄 😴 🤗 🤝 👍 👎 👏 🙏 💪 ❤️ 🧡 💛 💚 💙 💜 🖤 💔 💯 🔥 ✨ 🎉 🎊 🌹 🌞 🌙 💋 🫶 🥹 🤣 😇 😌 😋 😜 🤪 😱 🤫 🤭 🤦 🤷 💃 🕺 👑 🐆 🦁 🦋 🌍 ⚽ 🎵 🎁'.split(' ').map(e=>`<button onclick="insertChatEmoji('${e}')">${e}</button>`).join('')}</div></div><div id="drawerStickers" hidden><div class="sticker-grid">${[['🐆','Panthère'],['❤️','Amour'],['😍','J’adore'],['😂','Rire'],['😭','Larmes'],['🔥','Feu'],['👍','Bravo'],['🙏','Merci'],['🎉','Fête'],['🌹','Rose'],['👑','Boss'],['🫶','Soutien'],['💯','100 %'],['🤝','Respect'],['🥳','Célébration'],['✨','Éclat'],['😎','Stylé'],['🤗','Câlin'],['💔','Cœur brisé'],['🌍','Monde'],['⚽','Football'],['🎵','Musique'],['💪','Force'],['🥹','Émotion']].map(([e,n])=>`<button title="${n}" onclick="sendChatSticker('${e}')">${e}<small>${n}</small></button>`).join('')}</div></div></div></div></section><p class="note">Les messages, médias et stickers de ce prototype sont enregistrés localement. Les appels audio/vidéo et la synchronisation entre téléphones nécessitent un serveur sécurisé.</p>`;
 const th=document.getElementById('chatThread');if(th)th.scrollTop=th.scrollHeight;
}
function showChatDrawer(which){const d=document.getElementById('keyboardDrawer');if(!d)return;d.hidden=false;const em=document.getElementById('drawerEmoji'),st=document.getElementById('drawerStickers');if(em)em.hidden=which!=='emoji';if(st)st.hidden=which!=='stickers';document.getElementById('emojiTab')?.classList.toggle('active',which==='emoji');document.getElementById('stickerTab')?.classList.toggle('active',which==='stickers')}
function toggleChatPanel(id){const p=document.getElementById(id);if(!p)return;p.hidden=!p.hidden;if(!p.hidden)showChatDrawer('emoji')}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeChatProfile();closeMessageMenu()}});
render();
</script></body></html>
